name: Generate Snake Contribution Grid

on:
  schedule:
    # 每天半夜 00:00 自動刷新
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
    - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generate Snake SVG
        uses: platane/snk/svg-only@v3
        with:
          github_user_name: Richard-yq
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?color_snake=#8B5A2B&color_dots=#EBEDF0,#FFE4B5,#D2691E,#8B4513,#5C4033

      - name: Deploy to Output Branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
