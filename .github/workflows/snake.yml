name: Generate Snake Contribution Grid

on:
  schedule:
    # 每天半夜 00:00 自動刷新
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
    - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generate 5G Packet Flow SVG
        uses: platane/snk/svg-only@v3
        with:
          github_user_name: Richard-yq
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#0070F3&color_dots=#EBEDF0,#B3E5FC,#4FC3F7,#0288D1,#01579B
            dist/github-contribution-grid-snake-dark.svg?color_snake=#00F0FF&color_dots=#161B22,#093845,#0080B3,#00B4D8,#FF007F

      - name: Deploy to Output Branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
